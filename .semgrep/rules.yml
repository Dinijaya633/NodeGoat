rules:
  - id: nosql-injection-where-interpolation
    languages: [javascript]
    severity: ERROR
    message: >
      User-controlled input is interpolated directly into a MongoDB $where
      clause. This allows NoSQL injection (CWE-943). Use parseInt() or
      strict type validation before building the query.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A1:2017 - Injection"
      references:
        - https://owasp.org/www-project-nodejs-goat/
    patterns:
      - pattern-regex: "\\$where:.*'\\$\\{[^}]+\\}'"

  - id: idor-userid-from-params
    languages: [javascript]
    severity: ERROR
    message: >
      User ID is taken from the URL parameter (req.params) instead of from
      the authenticated session. This allows Insecure Direct Object Reference
      (IDOR) - a user can access other users' data by changing the URL.
      Use req.session.userId instead.
    metadata:
      cwe:
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp:
        - "A01:2021 - Broken Access Control"
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    patterns:
      - pattern-regex: "const\\s*\\{[^}]*userId[^}]*\\}\\s*=\\s*req\\.params"