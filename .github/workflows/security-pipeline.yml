name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master, secure, 'fix/**' ]
  pull_request:
    branches: [ master, secure ]

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Build & Test
  # ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Install dependencies
        run: npm install

      - name: Run tests (if any)
        run: npm test --if-present

  # ────────────────────────────────────────────────────────────
  # JOB 2: SAST (Static Application Security Testing)
  # ────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build-and-test
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep with custom rules
        run: |
          semgrep --config=.semgrep/rules.yml --error --text app/

  # ────────────────────────────────────────────────────────────
  # JOB 3: Dependency Scan
  # ────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

  # ────────────────────────────────────────────────────────────
  # JOB 4: Secrets Scan
  # ────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────
  # JOB 5: Container Scan
  # ────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nodegoat-web:${{ github.sha }} .

      - name: Run Trivy scan on the image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat-web:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true